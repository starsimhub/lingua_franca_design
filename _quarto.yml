website:
  title: "Lingua franca"
  description: "A design for a lingua franca for epidemic modeling, and its implementation as Starsim v4"
  repo-url: https://github.com/starsimhub/lingua_franca_design
  repo-actions: [source, issue]
  page-navigation: true
  search:
    type: overlay

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: approaches/index.qmd
        text: Approaches
      - href: best-practices/index.qmd
        text: Best practices
      - href: design/index.qmd
        text: Design
      - href: examples/index.qmd
        text: Examples
      - href: webapp/index.qmd
        text: Compare
      - href: admin/implementation.md
        text: Status
    tools:
      - icon: github
        href: https://github.com/starsimhub/lingua_franca_design

  sidebar:
    - id: approaches
      title: Approaches
      contents:
        - href: approaches/index.qmd
          text: "**Summary**"
