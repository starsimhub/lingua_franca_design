Solver choice and paradigm conversion:
  shares: {emulsion: 12, starsim: 10, epipack: 10, camdl: 10, memilio: 8, summer2: 5, other: 9, new: 36}
  notes:
    emulsion: switching paradigm with one word on the same model; its models as agreement tests
