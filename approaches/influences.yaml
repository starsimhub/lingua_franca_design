    epydemix: named data loaders (ss.people('Kenya'), ss.contacts())
    atomica: a data-entry databook generated from the model (deferred)
    emulsion: the per-value source= provenance field
    epipack: a rate as an expression of time and state
    odin: interpolation modes for ss.timeseries
    other: SimInf and MetaCast global versus per-group parameters; flepiMoP truncated normals
    new: ss.by, one broadcasting per-group parameter; separate value and prior; functions tried under every solver

Stratification:
  shares: {summer2: 30, camdl: 12, starsim: 10, metacast: 8, emod: 5, flepimop: 3, other: 8, new: 24}
  notes:
    summer2: stratifying a finished model; per-level adjustments; generated aging flows; source-strata splits
    camdl: declared named dimensions and stratify(by=); checked errors for stratified coverage
    starsim: dimensions as per-agent arrays on sim.people; strains as a second disease joined by connectors
    metacast: every partition, space included, as one operation; transfers between levels (ss.transfer)
    emod: Individual Properties as agent attributes that interventions target
    flepimop: compartments as a product of named axes
    other: HPVsim (genotypes), tbsim (strains), MIRA, Kendrick, pandas (inplace)
    new: agent properties and compartment axes as one declaration; sim-level versus disease-level stratification; results indexed by dimension

Geospatial and metapopulation:
  shares: {epymorph: 22, laser: 15, siminf: 15, metacast: 8, starsim: 8, epydemix: 3, other: 9, new: 20}
  notes:
    epymorph: disease, movement, and geography as separate declarations; commuting versus migration; named geography sources
    laser: named mobility generators (gravity and others); moving force of infection between patches
    siminf: a movement register of dated transfer events; per-node data and environmental state
    metacast: metapopulation as the same operation as stratification; per-subpopulation parameters
    starsim: patch as an agent property; MixingPool grouped by patch; bundled and fetched geodata
    epydemix: bundled populations and contact matrices for 400+ places
    other: the standard time-share commuting formulation (Sattenspiel, Keeling and Rohani); MEmilio's in-transit question
    new: space as an ordinary dimension that may have no movement; a pluggable geography protocol; geography in the run hash

Mixing and networks:
  shares: {starsim: 40, epimodel: 15, metacast: 4, summer2: 3, camdl: 3, siminf: 3, epydemix: 3, other: 10, new: 19}
  notes:
    starsim: networks and mixing pools behind networks=; layers; beta per network; the per-edge transmission probability
    epimodel: networks specified by target statistics; net.check; partnerships kept separate from acts; match=
    metacast: exposing the choice of denominator; relative infectiousness of states
    summer2: frequency versus density dependence named explicitly
    camdl: the library supplying /N
    siminf: an environmental reservoir driving transmission
    epydemix: household, school, and work layers with bundled contact matrices
    other: Prem and Mistry contact matrices; Covasim layers; Ross-Macdonald vectors; EpiHiper
    new: a bare state means contact while I.n is a count; homogeneous mixing by default with the textbook beta; one force-of-infection formula

Interactions and effects:
  shares: {starsim: 35, vivarium: 25, epidemics: 7, epiworld: 3, individual: 3, other: 4, new: 23}
  notes:
    starsim: one module abstraction; connectors and step() code; the ordered loop; deferred removal
    vivarium: value pipelines (a base value plus modifiers combined by a rule, restored automatically)
    epidemics: the combination rule as a stated modeling decision; add= as the alternative
    epiworld: tools as bundles of multiplicative effects
    individual: resolving competing hazards jointly and deferring updates
    other: EMOD waning; epymorph requirements; Epydemix contact reductions; Mesa
    new: one-line ss.modify over any named quantity; reading the effective value and writing the base; track_writes

