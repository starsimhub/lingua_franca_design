# What the lingua franca owes to each framework, by area: a rough judgment from reading
# best-practices/ and design/ against approaches/ (2026-10-15). Shares in each area add to 100.
# "new" is what no framework did first; "other" is frameworks without a review here (named in the note).
# A framework cited only as a counterexample, or for an approach that was rejected, gets nothing.
# Drawn by influences.py on approaches/influences.qmd.

Principles, defaults and errors:
  shares: {camdl: 22, starsim: 18, atomica: 4, epidemics: 3, emulsion: 3, odin: 3, other: 8, new: 39}
  notes:
    camdl: error messages as part of the language (stable codes, naming the rule, quoting the expression, giving the fix)
    starsim: plain Python and step() as first class, the ordered inspectable loop, define_pars name checking
    atomica: the benchmark that non-programmers can define a full model
    epidemics: trading flexibility for ease of use, aimed at practitioners
    emulsion: a model that can be discussed with non-modelers; exponential as the assumed dwell time
    odin: showing what was resolved, which motivates printing every guess
    other: summer2's error on partial stratifications; Epydemix's AGENT.md; rustc/Elm-style diagnostics
    new: guess the default and print it ([guessed] in describe()); approximate rather than refuse; one vocabulary at several lengths; the error-code catalog

Model structure:
  shares: {camdl: 20, starsim: 18, siminf: 8, epihiper: 7, emulsion: 4, memilio: 3, epipack: 3, atomica: 3, other: 9, new: 25}
  notes:
    camdl: the model as data; named transitions with rates after '@'; incidence per transition; Erlang sub-stages
    starsim: declared states on ss.Disease modules, init_prev, rel_sus/rel_trans, sample-and-schedule dwell times, automatic n_<state> results
    siminf: arrow-string transitions; compartments versus continuous variables, the precedent for states that are counts
    epihiper: a dwell-time distribution per transition; susceptibility and infectivity as properties of a state
    emulsion: interchangeable rate, probability, and duration keys
    memilio: LCT models as the precedent for Erlang staging
    epipack: ODEs derived from declared transitions (equations())
    atomica: the transition matrix as a tabular view of the model
    other: MIRA (natural versus controlled conversions); sympy.symbols idiom for ss.states(); odin, EoN, MetaCast, summer2
    new: one transition kind, typed by whether its rate mentions a state; the >> and @ spelling; weighted-destination branching; ss.null; names taken from variables

Time and units:
  shares: {starsim: 60, camdl: 10, odin: 4, other: 8, new: 18}
  notes:
    starsim: the whole type system, unchanged (ss.dur, ss.per, ss.prob, ss.freq, dates, Timeline, per-module timesteps)
    camdl: dimension checking of rate expressions when the model is built
    odin: transparency about the rate-to-probability conversion
    other: time counted in steps when nothing has a unit (EpiModel, individual, LASER, epiworld, SimInf, ...)
    new: bare numbers typed by their slot and given the sim's unit; the unit-inference rules; timesteps as the fallback

